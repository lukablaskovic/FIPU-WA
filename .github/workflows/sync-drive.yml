name: Sync course materials to Google Drive

on:
  push:
    branches: [main]
    paths:
      - 'WA[1-7] - */*.md'
      - 'WA[1-7] - */*.pdf'
      - 'script-patcher/**'
      - '.github/workflows/sync-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-google-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script-patcher/requirements.txt
      - name: Check file selection and update planning
        run: python script-patcher/test_sync.py
      - name: Install dependencies
        run: python -m pip install -r script-patcher/requirements.txt
      - name: Upload changed Markdown and PDF files
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: python -u script-patcher/index.py
